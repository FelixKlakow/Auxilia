# CLA signing on pull requests (CLA Assistant Lite — runs entirely in this repository,
# no external service). On every PR from a not-yet-signed contributor the action posts a
# comment; the contributor signs by replying with the sign-off sentence, and the signature
# is recorded as JSON on the cla-signatures branch. The repository owner and bots are
# allowlisted — the Licensor does not sign his own CLA.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >
      (github.event.comment.body == 'recheck'
       || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/FelixKlakow/Auxilia/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: 'FelixKlakow,dependabot[bot],*[bot]'
